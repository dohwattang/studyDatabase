<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace Hub — 로그인</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans KR & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --font-sans: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      background-color: #0b0f19;
      background-image:
        radial-gradient(at 15% 10%, rgba(79, 70, 229, 0.16) 0px, transparent 45%),
        radial-gradient(at 85% 15%, rgba(16, 185, 129, 0.12) 0px, transparent 45%),
        radial-gradient(at 50% 90%, rgba(245, 158, 11, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
      color: #f8fafc;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    .font-mono {
      font-family: var(--font-mono);
    }

    /* index.html 허브 카드와 동일한 글래스모피즘 스타일 */
    .login-card {
      position: relative;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    /* 상단 3색 그라데이션 포인트 라인 */
    .login-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #6366f1, #10b981, #f59e0b);
    }

    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .animate-shake {
      animation: shakeError 0.35s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- ===================================================================== -->
  <!-- 중앙 단독 로그인 카드                                                  -->
  <!-- ===================================================================== -->
  <main class="w-full max-w-md">
    <section id="loginCard" class="login-card p-7 sm:p-9">
      
      <!-- 상단 로고 & 타이틀 -->
      <div class="flex flex-col items-center text-center mb-7">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 via-purple-500 to-emerald-400 p-[1.5px] shadow-lg shadow-indigo-500/20 mb-4">
          <div class="w-full h-full bg-slate-950 rounded-[14.5px] flex items-center justify-center font-mono font-extrabold text-base text-white">
            HUB
          </div>
        </div>
        <h1 class="text-xl font-extrabold tracking-tight text-white">MY PROJECT HUB</h1>
        <p class="text-xs text-slate-400 mt-1">워크스페이스 접근을 위해 로그인해 주세요</p>
      </div>

      <!-- 로그인 폼 -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4" novalidate>
        
        <!-- 아이디 입력 -->
        <div>
          <label for="userIdInput" class="block text-xs font-semibold text-slate-300 mb-1.5">
            아이디
          </label>
          <div class="relative">
            <i data-lucide="user" class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input
              id="userIdInput"
              type="text"
              required
              autocomplete="username"
              placeholder="ID 입력"
              class="w-full pl-10 pr-4 py-2.5 text-sm font-mono bg-slate-950/90 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
            />
          </div>
        </div>

        <!-- 비밀번호 입력 -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="userPwInput" class="block text-xs font-semibold text-slate-300">
              비밀번호
            </label>
            <span id="capsLockWarning" class="hidden text-[11px] font-semibold text-amber-400 flex items-center gap-1">
              <i data-lucide="alert-triangle" class="w-3 h-3"></i>
              <span>Caps Lock 켜짐</span>
            </span>
          </div>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input
              id="userPwInput"
              type="password"
              required
              autocomplete="current-password"
              onkeyup="checkCapsLock(event)"
              placeholder="Password 입력"
              class="w-full pl-10 pr-10 py-2.5 text-sm font-mono bg-slate-950/90 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
            />
            <button
              type="button"
              onclick="togglePasswordVisibility()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 p-1 cursor-pointer"
              tabindex="-1"
              aria-label="비밀번호 표시 전환"
            >
              <i id="pwEyeIcon" data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- 로그인 유지 옵션 -->
        <div class="flex items-center justify-between pt-1">
          <label class="inline-flex items-center gap-2 cursor-pointer select-none">
            <input
              id="rememberMeChk"
              type="checkbox"
              class="rounded bg-slate-950 border-slate-700 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-900 w-4 h-4"
            />
            <span class="text-xs text-slate-400">로그인 상태 유지</span>
          </label>
        </div>

        <!-- 에러/상태 메시지 박스 -->
        <div
          id="errorBox"
          class="hidden px-3.5 py-2.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center gap-2"
        >
          <i data-lucide="alert-circle" class="w-4 h-4 text-rose-400 shrink-0"></i>
          <span id="errorText">아이디 또는 비밀번호가 올바르지 않습니다.</span>
        </div>

        <!-- 로그인 버튼 -->
        <button
          id="submitBtn"
          type="submit"
          class="w-full py-3 px-4 mt-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold text-sm shadow-lg shadow-indigo-600/25 flex items-center justify-center gap-2 transition cursor-pointer"
        >
          <span id="submitBtnText">로그인</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>

      </form>
    </section>
  </main>

  <!-- ===================================================================== -->
  <!-- 외부 ./users.json 참조 인증 스크립트                                   -->
  <!-- 같은 폴더에 아래 형식의 users.json 파일을 두면 자동으로 읽어옵니다.    -->
  <!--
  [
    { "id": "202627033", "password": "python1234", "name": "홍길동" },
    { "id": "admin", "password": "hub2026", "name": "관리자" }
  ]
  -->
  <!-- ===================================================================== -->
  <script>
    const JSON_FILE_URL = './iogin.json';
    const REDIRECT_URL = 'index.html';
    const SESSION_KEY = 'hubAuthUser';

    // 외부 users.json 파일 로드 전이거나 로컬 환경일 때 사용할 기본 계정 목록
    const FALLBACK_USERS = [
      { id: 'dohwattang', password: '428591', name: '도화' },
      { id: 'admin', password: 'admin', name: '관리자' }
    ];

    // 외부 JSON 파일에서 사용자 배열 가져오기
    async function fetchUsersList() {
      try {
        const res = await fetch(JSON_FILE_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('JSON load failed');
        const data = await res.json();
        if (Array.isArray(data)) return data;
        if (data && Array.isArray(data.users)) return data.users;
      } catch (_) {
        // 외부 파일이 없거나 로컬 file:// 환경일 경우 기본 계정 배열 반환
      }
      return FALLBACK_USERS;
    }

    async function handleLogin(event) {
      event.preventDefault();

      const idInput = document.getElementById('userIdInput');
      const pwInput = document.getElementById('userPwInput');
      const rememberChk = document.getElementById('rememberMeChk');
      const submitBtn = document.getElementById('submitBtn');
      const submitBtnText = document.getElementById('submitBtnText');

      const userId = (idInput.value || '').trim();
      const userPw = pwInput.value || '';

      if (!userId || !userPw) {
        showError('아이디와 비밀번호를 모두 입력해 주세요.');
        return;
      }

      submitBtn.disabled = true;
      submitBtnText.textContent = '확인 중...';

      const users = await fetchUsersList();
      const matched = users.find(
        u => String(u.id).toLowerCase() === userId.toLowerCase() && String(u.password) === userPw
      );

      if (!matched) {
        submitBtn.disabled = false;
        submitBtnText.textContent = '로그인';
        showError('아이디 또는 비밀번호가 일치하지 않습니다.');
        return;
      }

      // 인증 성공 시 세션 저장 후 index.html로 이동
      const sessionData = JSON.stringify({
        id: matched.id,
        name: matched.name || matched.id,
        loginAt: new Date().toISOString()
      });

      try {
        sessionStorage.setItem(SESSION_KEY, sessionData);
        if (rememberChk.checked) {
          localStorage.setItem(SESSION_KEY, sessionData);
        } else {
          localStorage.removeItem(SESSION_KEY);
        }
      } catch (_) {}

      window.location.href = REDIRECT_URL;
    }

    function showError(msg) {
      const errorBox = document.getElementById('errorBox');
      const errorText = document.getElementById('errorText');
      const card = document.getElementById('loginCard');

      errorText.textContent = msg;
      errorBox.classList.remove('hidden');

      card.classList.remove('animate-shake');
      void card.offsetWidth;
      card.classList.add('animate-shake');
    }

    function togglePasswordVisibility() {
      const pwInput = document.getElementById('userPwInput');
      const icon = document.getElementById('pwEyeIcon');
      if (pwInput.type === 'password') {
        pwInput.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        pwInput.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    function checkCapsLock(event) {
      const warning = document.getElementById('capsLockWarning');
      if (!warning || !event.getModifierState) return;
      warning.classList.toggle('hidden', !event.getModifierState('CapsLock'));
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      document.getElementById('userIdInput').focus();
    });
  </script>
</body>
</html>
